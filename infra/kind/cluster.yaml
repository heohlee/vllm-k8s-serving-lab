kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vllm-lab
nodes:
  - role: control-plane
  - role: worker
    labels:
      gpu: amd
      pool: gpu
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: pool
              value: gpu
              effect: NoSchedule
  - role: worker
    labels:
      pool: cpu
