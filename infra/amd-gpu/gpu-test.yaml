apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  restartPolicy: Never
  tolerations:
    - key: pool
      operator: Equal
      value: gpu
      effect: NoSchedule
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: gpu-test
  containers:
    - name: rocminfo
      image: rocm/rocm-terminal:latest
      imagePullPolicy: IfNotPresent
      command: ["bash", "-c", "rocminfo | grep -E 'Marketing Name|Name: +gfx'"]
      resources:
        claims:
          - name: gpu
