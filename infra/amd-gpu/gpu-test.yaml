apiVersion: v1
kind: Pod
metadata:
  name: gpu-test
spec:
  restartPolicy: Never
  containers:
    - name: rocminfo
      image: rocm/rocm-terminal:latest
      imagePullPolicy: IfNotPresent
      command: ["bash", "-c", "rocminfo | grep -E 'Marketing Name|Name: +gfx'"]
      resources:
        limits:
          amd.com/gpu: 1
