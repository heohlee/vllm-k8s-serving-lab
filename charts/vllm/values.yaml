vllm-stack:
  servingEngineSpec:
    tolerations:
      - key: pool
        operator: Equal
        value: gpu
        effect: NoSchedule
    serviceMonitor:
      enabled: true
  routerSpec:
    nodeSelectorTerms:
      - matchExpressions:
          - key: pool
            operator: In
            values: ["cpu"]
    serviceMonitor:
      enabled: true
  grafanaDashboards:
    enabled: true
