servingEngineSpec:
  runtimeClassName: ""
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  imagePullPolicy: IfNotPresent
  modelSpec:
    - name: "qwen05b"
      repository: "vllm/vllm-openai-rocm"
      tag: "v0.33.0"
      modelURL: "Qwen/Qwen2.5-0.5B-Instruct"
      replicaCount: 2
      requestCPU: 2
      requestMemory: "8Gi"
      pvcStorage: "10Gi"
      pvcExistingClaimName: vllm-models
      vllmConfig:
        enablePrefixCaching: true
        maxModelLen: 4096
        gpuMemoryUtilization: 0.4
      env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.0.0"
        - name: VLLM_CACHE_ROOT
          value: /data/vllm-cache
routerSpec:
  routingLogic: "prefixaware"
