servingEngineSpec:
  runtimeClassName: ""
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  imagePullPolicy: IfNotPresent
  modelSpec:
    - name: "qwen05b"
      repository: "vllm/vllm-openai-rocm"
      tag: "v0.33.0"
      modelURL: "Qwen/Qwen2.5-0.5B-Instruct"
      replicaCount: 1
      requestCPU: 2
      requestMemory: "8Gi"
      vllmConfig:
        maxModelLen: 4096
        gpuMemoryUtilization: 0.8
      env:
        - name: HSA_OVERRIDE_GFX_VERSION
          value: "11.0.0"
